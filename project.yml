name: DongKe
options:
  bundleIdPrefix: app.dongke
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: UKXWZ3FS84
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
targets:
  DongKeCore:
    type: framework
    platform: iOS
    sources:
      - path: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  DongKe:
    type: application
    platform: iOS
    sources:
      - path: DongKe
      - path: Shared
    dependencies:
      - target: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.ios
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 动刻
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用语音说出你的训练想法，转成文字填进输入框。录音只在本机转写，不会上传到我们的服务器。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 把你说的一句话转成文字，用来生成训练计划。优先在本机完成识别，不保存录音。
  DongKeCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DongKeCoreTests
    dependencies:
      - target: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.core.tests
        GENERATE_INFOPLIST_FILE: YES
  DongKeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DongKeUITests
      - path: Shared
    dependencies:
      - target: DongKe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DongKe
schemes:
  DongKe:
    build:
      targets:
        DongKe: all
        DongKeCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DongKeCoreTests
        - DongKeUITests
