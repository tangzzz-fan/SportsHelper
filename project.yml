name: DongKe
options:
  bundleIdPrefix: app.dongke
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: UKXWZ3FS84
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
targets:
  DongKeCore:
    type: framework
    platform: iOS
    sources:
      - path: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  DongKe:
    type: application
    platform: iOS
    sources:
      - path: DongKe
      - path: Shared
      - path: VoiceClips
        type: folder
        buildPhase: resources
    dependencies:
      - target: DongKeCore
    # 启动屏的 UILaunchScreen 是嵌套字典，build setting（INFOPLIST_KEY_*）只能传字符串，
    # 所以 target 改用真实 Info.plist。键与之前 GENERATE_INFOPLIST_FILE 的产物一一对应。
    info:
      path: DongKe/Info.plist
      properties:
        CFBundleDisplayName: 动刻
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 用语音说出你的训练想法，转成文字填进输入框。录音只在本机转写，不会上传到我们的服务器。
        NSSpeechRecognitionUsageDescription: 把你说的一句话转成文字，用来生成训练计划。优先在本机完成识别，不保存录音。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # 顶层写死了 Apple Development，Archive 走 Release 会签不出来。
        # 分发用单独的 Distribution 身份（本机已有 Apple Distribution: zhenzhi Tang）。
        Release:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
  DongKeCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DongKeCoreTests
    dependencies:
      - target: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.core.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DongKe:
    build:
      targets:
        DongKe: all
        DongKeCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DongKeCoreTests
