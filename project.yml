name: DongKe
options:
  bundleIdPrefix: app.dongke
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: UKXWZ3FS84
    # Automatic 模式下**不要**写 CODE_SIGN_IDENTITY：Xcode 会按用途自己挑
    # （debug 用 Apple Development，Archive 用 Apple Distribution）。
    # 手动指定会和自动签名打架，报 "conflicting provisioning settings"。
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
    # 版本号放顶层而不是单个 target：embed 的 framework 缺
    # CFBundleShortVersionString 会被 App Store 校验直接拒
    # （`The bundle 'DongKeCore.framework' is missing plist key`）。
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DongKeCore:
    type: framework
    platform: iOS
    sources:
      - path: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  DongKe:
    type: application
    platform: iOS
    sources:
      - path: DongKe
      - path: Shared
      - path: VoiceClips
        type: folder
        buildPhase: resources
    dependencies:
      - target: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.ios
        # Info.plist 全交给 Xcode 生成（GENERATE_INFOPLIST_FILE），不维护自己的 plist。
        #
        # 启动屏要上色，只能走 storyboard：`UILaunchScreen` 是嵌套字典，
        # 而 Xcode 只有两个启动屏相关设置（CoreBuildSystem.xcspec 可查）——
        # `UILaunchScreen_Generation`（只会塞一个空字典）和 `UILaunchStoryboardName`。
        # 没有设置 `UIColorName` 的入口，所以给一个 12 行的 storyboard + 一个颜色集。
        # 注意两者互斥：留着 Generation=YES 会生成空 `UILaunchScreen`，它优先于 storyboard。
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 只做 iPhone。界面没有 iPad 布局分支，方向声明也只有 iPhone 那套，
        # 声明支持 iPad（默认的 1,2）会让审核在 iPad 上跑一遍再按 2.1/4.2 拒。
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: 动刻
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用语音说出你的训练想法，转成文字填进输入框。录音只在本机转写，不会上传到我们的服务器。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 把你说的一句话转成文字，用来生成训练计划。优先在本机完成识别，不保存录音。
  DongKeCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DongKeCoreTests
    dependencies:
      - target: DongKeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dongke.core.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DongKe:
    build:
      targets:
        DongKe: all
        DongKeCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DongKeCoreTests
